name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
          pip install numpy matplotlib

      - name: Lint RTL (Verilator -Wall)
        run: make lint

      - name: RTL + real-number model, directed scenarios (Icarus)
        run: make directed

      - name: Generic synthesis (Yosys)
        run: make synth

      - name: Python reference model and RTL correlation
        run: make model
